# Builds "ink sunset": ink music 2.1.26, exactly as released (inkappdev/ink-music, tag v2.1.26),
# with this repo's theme/ folder laid over it. The APK lands in two places:
#   - this run's page, under Artifacts (a zip with the APK inside)
#   - Releases, on the repo's front page (the APK itself: the easy one to open on a phone)
# Runs on every push, or by hand: Actions > Build ink sunset > Run workflow.
name: Build ink sunset

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK as a release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  INK_TAG: v2.1.26

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # optional: your own signing key, so later builds install over this one (see README)
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - name: Get the theme (this repo)
        uses: actions/checkout@v4
        with:
          path: theme-repo

      - name: Get ink music ${{ env.INK_TAG }} (the official source)
        uses: actions/checkout@v4
        with:
          repository: inkappdev/ink-music
          ref: ${{ env.INK_TAG }}
          path: ink-music

      - name: Lay the theme over it
        run: |
          cp -rv theme-repo/theme/. ink-music/
          echo "--- changed from the official ${INK_TAG}:"
          git -C ink-music status --short

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: NDK and CMake (the versions ink music pins)
        run: |
          sdkmanager --install "ndk;29.0.14206865" > /dev/null
          if ! sdkmanager --install "cmake;3.31.6" > /dev/null; then
            echo "the SDK has no CMake 3.31.6: taking it (and Ninja) from PyPI instead"
            pipx install cmake==3.31.6
            pipx install ninja
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Signing key (only if you added one)
        if: env.KEYSTORE_B64 != ''
        working-directory: ink-music
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sunset.p12"
          {
            echo "storeFile=$RUNNER_TEMP/sunset.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=sunset"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Build the APK
        working-directory: ink-music
        # -PphoneOnly: the phone's app alone (the desktop app isn't set up), as F-Droid builds it
        run: ./gradlew -PphoneOnly :app:assembleFullRelease --stacktrace

      - name: Name it
        run: |
          mkdir out
          cp ink-music/app/build/outputs/apk/full/release/*.apk "out/ink-sunset-${INK_TAG#v}.apk"
          ls -l out

      - name: Upload (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ink-sunset-apk
          path: out/*.apk

      - name: Publish (Releases)
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="sunset-${INK_TAG#v}-build${GITHUB_RUN_NUMBER}"
          gh release create "$tag" out/*.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ink sunset ${INK_TAG#v} (build ${GITHUB_RUN_NUMBER})" \
            --notes "ink music ${INK_TAG#v} built from the official source (inkappdev/ink-music, tag ${INK_TAG}) with this repo's SUNSET DRIVE theme. Unofficial. GPL-3.0: the source is ink music's at that tag plus this repo's theme/ folder."
