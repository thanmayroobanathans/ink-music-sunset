# Builds two editions of ink music 2.1.26, exactly as released (inkappdev/ink-music, tag v2.1.26), each with its
# folder from themes/ laid over it:
#   - Neon Coast (themes/neon-coast): Miami at night        -> neon-coast-2.1.26.apk, app.ink.music.sunset
#   - Vigil      (themes/vigil):      a rainy city, midnight -> vigil-2.1.26.apk,      app.ink.music.vigil
# Each APK lands under Releases (and this run's Artifacts). Then each is photographed on an emulator, the pictures
# going to a draft release (seen only by people with access to the repo).
# Runs on every push, or by hand: Actions > Build the editions > Run workflow.
name: Build the editions

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # to publish the APKs as releases

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  INK_TAG: v2.1.26

jobs:
  build:
    name: build ${{ matrix.edition.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        edition:
          - { id: neon-coast, name: Neon Coast }
          - { id: vigil, name: Vigil }
    env:
      # optional: your own signing key, so later builds install over the last (see README)
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      EDITION: ${{ matrix.edition.id }}
      EDITION_NAME: ${{ matrix.edition.name }}
    steps:
      - name: Get the themes (this repo)
        uses: actions/checkout@v5
        with:
          path: theme-repo

      - name: Get ink music ${{ env.INK_TAG }} (the official source)
        uses: actions/checkout@v5
        with:
          repository: inkappdev/ink-music
          ref: ${{ env.INK_TAG }}
          path: ink-music

      - name: Lay the ${{ matrix.edition.name }} theme over it
        run: |
          cp -rv "theme-repo/themes/$EDITION/." ink-music/
          echo "--- changed from the official ${INK_TAG}:"
          git -C ink-music status --short

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK licences, NDK and CMake (the versions ink music pins)
        # the runner's own SDK (setup-android@v3 asks for the long-gone 'tools' package and fails)
        run: |
          sdkm=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "using $sdkm"
          yes | "$sdkm" --licenses > /dev/null || true
          "$sdkm" --install "ndk;29.0.14206865" > /dev/null
          if ! "$sdkm" --install "cmake;3.31.6" > /dev/null; then
            echo "the SDK has no CMake 3.31.6: taking it (and Ninja) from PyPI instead"
            pipx install cmake==3.31.6
            pipx install ninja
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Signing key (only if you added one)
        if: env.KEYSTORE_B64 != ''
        working-directory: ink-music
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sunset.p12"
          {
            echo "storeFile=$RUNNER_TEMP/sunset.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=sunset"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Build the APK
        working-directory: ink-music
        # -PphoneOnly: the phone's app alone (the desktop app isn't set up), as F-Droid builds it
        run: ./gradlew -PphoneOnly :app:assembleFullRelease --stacktrace

      - name: Name it
        run: |
          mkdir out
          cp ink-music/app/build/outputs/apk/full/release/*.apk "out/${EDITION}-${INK_TAG#v}.apk"
          ls -l out

      - name: Upload (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition.id }}-apk
          path: out/*.apk

      - name: The permanent link (always the newest)
        # releases/download/<edition>-latest/<edition>.apk: the address on the website and on any QR code
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "out/${EDITION}-${INK_TAG#v}.apk" "out/${EDITION}.apk"
          gh release view "${EDITION}-latest" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create "${EDITION}-latest" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "${EDITION_NAME}: the newest" --notes "${EDITION_NAME}'s newest build, always at this address. Every build is also kept as its own release."
          gh release upload "${EDITION}-latest" "out/${EDITION}.apk" --repo "$GITHUB_REPOSITORY" --clobber
          rm "out/${EDITION}.apk"

      - name: Publish (Releases)
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${EDITION}-${INK_TAG#v}-build${GITHUB_RUN_NUMBER}"
          gh release create "$tag" out/*.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "${EDITION_NAME} ${INK_TAG#v} (build ${GITHUB_RUN_NUMBER})" \
            --notes "ink music ${INK_TAG#v} built from the official source (inkappdev/ink-music, tag ${INK_TAG}) with this repo's ${EDITION_NAME} theme (themes/${EDITION}). Unofficial. GPL-3.0: the source is ink music's at that tag plus that folder."

  site:
    # Neon Coast's website (site/), with the newest build's version, size and SHA-256 written in, on GitHub Pages:
    # https://thanmayroobanathans.github.io/ink-music-sunset/ (Pages must be on, its source "GitHub Actions")
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Get the site (this repo)
        uses: actions/checkout@v5

      - name: Get Neon Coast's APK (the same file as the download link)
        uses: actions/download-artifact@v4
        with:
          name: neon-coast-apk
          path: apk

      - name: Write the build's facts into the page
        run: |
          f=$(ls apk/*.apk | head -1)
          size=$(python3 -c 'import os, sys; print(f"{os.path.getsize(sys.argv[1]) / 1048576:.1f} MB")' "$f")
          sha=$(sha256sum "$f" | cut -d' ' -f1)
          ver=$(grep -oE 'versionName = "[^"]+"' themes/neon-coast/app/build.gradle.kts | cut -d'"' -f2)
          built=$(date -u +'%-d %B %Y')
          sed -i "s|{{VERSION}}|$ver|g; s|{{SIZE}}|$size|g; s|{{SHA256}}|$sha|g; s|{{BUILT}}|$built|g" site/index.html
          ! grep -n '{{' site/index.html
          echo "version $ver, $size, built $built, sha256 $sha"

      - name: Pages
        uses: actions/configure-pages@v5

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish the site
        id: deploy
        uses: actions/deploy-pages@v4

  screens:
    # each built app on an emulator, photographed; never holds up a release
    name: screens ${{ matrix.edition.shots }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        edition:
          # a phone's size (a Pixel 7, 1080 x 2400): the pictures are sharp enough for the website
          - { id: neon-coast, shots: neon-coast, pkg: app.ink.music.sunset, home: cruise, settings: safehouse, radio: airwaves, artist: Neon Coast, api: 34, profile: pixel_7, rotate: "" }
          - { id: vigil, shots: vigil, pkg: app.ink.music.vigil, home: the beat, settings: hideout, radio: night radio, artist: Vigil, api: 34, profile: pixel_7, rotate: "" }
    env:
      EDITION: ${{ matrix.edition.id }}
      SHOTS: ${{ matrix.edition.shots }}
      ROTATE: ${{ matrix.edition.rotate }}
      PKG: ${{ matrix.edition.pkg }}
      HOME_WORD: ${{ matrix.edition.home }}
      SETTINGS_WORD: ${{ matrix.edition.settings }}
      RADIO_WORD: ${{ matrix.edition.radio }}
      ARTIST: ${{ matrix.edition.artist }}
    steps:
      - name: Get the script (this repo)
        uses: actions/checkout@v5

      - name: Get the APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.edition.id }}-apk
          path: apk

      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: A song to play (two tones, made here)
        run: |
          command -v ffmpeg > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
          mkdir -p music
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=220:duration=240" -f lavfi -i "sine=frequency=330:duration=240" \
            -filter_complex amix=inputs=2 -metadata title="Night Drive" -metadata artist="$ARTIST" -metadata album="After Dark" \
            -c:a libmp3lame -b:a 128k music/night-drive.mp3

      - name: Screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.edition.api }}
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.edition.profile }}
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/screens.sh

      - name: Screens to a draft release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find shots -name '*.png' -size 0 -delete 2>/dev/null || true
          ls shots/*.png > /dev/null 2>&1 || { echo "no screenshots"; exit 0; }
          gh release create "screens-${SHOTS}-build${GITHUB_RUN_NUMBER}" shots/* --draft \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Screens: ${SHOTS}, build ${GITHUB_RUN_NUMBER}" --notes "The built app on an emulator."
